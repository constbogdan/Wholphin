name: Upstream — Synchronization
run-name: Observe upstream · ${{ github.event_name }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    # UTC is fixed: 08:00/17:00/23:00 Bucharest in winter, 09:00/18:00/00:00 in summer.
    - cron: '0 6,15,21 * * *'

permissions:
  contents: read

# Serializes attempts, including reruns. Never cancel publication halfway through.
concurrency:
  group: wholphin-upstream-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  observe:
    name: Observe upstream integration
    if: github.event_name != 'pull_request' && github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      outcome: ${{ steps.observe.outputs.outcome }}
      upstream: ${{ steps.observe.outputs.upstream_sha }}
      downstream: ${{ steps.observe.outputs.downstream_sha }}
    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe and attempt isolated integration (read-only token)
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIGURED_SCHEDULE: ${{ github.event.schedule || 'manual' }}
        run: python3 scripts/hosted_upstream.py --output "$RUNNER_TEMP/observation.json"
      - name: Retain complete observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-observation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish candidate or record block
    needs: observe
    if: >-
      github.event_name != 'pull_request' && github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' &&
      needs.observe.outputs.outcome != 'no_delta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint repository-scoped publication token
        # Only candidate publication paths need the App's Contents/PR authority.
        # Journal Issues use the job token; all-excluded observations create no Issue.
        # An empty App output is expected when this step is skipped; it is not a binding failure.
        if: contains(fromJSON('["ready","review_required","semantic_conflict"]'), needs.observe.outputs.outcome)
        id: publication
        continue-on-error: true # The helper records missing credentials as a durable blocked issue.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SYNC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_BOT_PRIVATE_KEY }}
          owner: constbogdan
          repositories: Wholphin
          permission-contents: write
          permission-pull-requests: write
      - name: Recheck exact inputs and publish or record blocked attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PUBLISH_TOKEN: ${{ steps.publication.outputs.token }}
          EXPECTED_UPSTREAM: ${{ needs.observe.outputs.upstream }}
          EXPECTED_DOWNSTREAM: ${{ needs.observe.outputs.downstream }}
          CONFIGURED_SCHEDULE: ${{ github.event.schedule || 'manual' }}
        run: >-
          python3 scripts/hosted_upstream.py --publish
          --expected-upstream "$EXPECTED_UPSTREAM" --expected-downstream "$EXPECTED_DOWNSTREAM"
          --output "$RUNNER_TEMP/outcome.json"
      - name: Retain complete outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-outcome-${{ github.run_attempt }}
          path: ${{ runner.temp }}/outcome.json
          retention-days: 14
          if-no-files-found: error

  finalize-merged-episode:
    name: Close merged upstream journal
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.repo.full_name == 'constbogdan/Wholphin' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'constbogdan/Wholphin' &&
      startsWith(github.event.pull_request.head.ref, 'chore/sync-upstream-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout trusted merged main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Authenticate episode, record merged terminal state and close journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/hosted_upstream.py --finalize-merged-pr
          --pr-number "${{ github.event.pull_request.number }}"
          --output "$RUNNER_TEMP/finalization.json"
      - name: Retain finalization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-finalization-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/finalization.json
          retention-days: 14
          if-no-files-found: error
