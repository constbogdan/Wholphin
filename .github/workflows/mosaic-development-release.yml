name: Mosaic development release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Explicitly authorized full protected-main SHA to build, sign and publish'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mosaic-development-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MOSAIC_EXERCISE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

jobs:
  classify:
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_required: ${{ steps.eligibility.outputs.release_required }}
      outcome: ${{ steps.eligibility.outputs.outcome }}
      release_relevance: ${{ steps.eligibility.outputs.release_relevance }}
      validation_risk: ${{ steps.eligibility.outputs.validation_risk }}
      baseline_sha: ${{ steps.eligibility.outputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete unpublished Development range
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py eligibility

  build:
    needs: classify
    if: >-
      needs.classify.outputs.release_required == 'true' &&
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      name: ${{ steps.prepare.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful exact-main push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py trust
      - uses: ./.github/actions/setup
      - name: Build unsigned Release after validation
        run: |
          ./gradlew :app:assembleDefaultRelease -PmosaicPublication=true --no-daemon --no-parallel --max-workers=1
      - name: Prepare exact universal unsigned input
        id: prepare
        run: python -B scripts/mosaic_signing_exercise.py prepare --directory "$RUNNER_TEMP/mosaic-input"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: unsigned-${{ steps.prepare.outputs.name }}
          path: ${{ runner.temp }}/mosaic-input/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  sign:
    needs: build
    permissions:
      contents: read
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    environment: mosaic-release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout/SDK setup and all input checks finish before key injection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Require exact build-job artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-input
      - name: Verify trusted unsigned input
        run: |
          python3 -B scripts/mosaic_signing_exercise.py check --directory "$RUNNER_TEMP/mosaic-input"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/mosaic-input/unsigned.apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/mosaic-input/unsigned.apk" >/dev/null 2>&1; then
            echo 'Refusing already signed input' >&2
            exit 1
          fi
      - name: Sign exact input without rebuilding
        env:
          MOSAIC_SIGNING_KEY: ${{ secrets.MOSAIC_SIGNING_KEY }}
          MOSAIC_KEY_ALIAS: ${{ secrets.MOSAIC_KEY_ALIAS }}
          MOSAIC_KEYSTORE_PASSWORD: ${{ secrets.MOSAIC_KEYSTORE_PASSWORD }}
          MOSAIC_KEY_PASSWORD: ${{ secrets.MOSAIC_KEY_PASSWORD }}
        uses: ./.github/actions/mosaic-sign-apk
      - name: Verify signed identity and unchanged payload
        run: |
          python3 -B scripts/mosaic_signing_exercise.py compare --directory "$RUNNER_TEMP/mosaic-input"
          mkdir "$RUNNER_TEMP/mosaic-result"
          python3 -B scripts/verify_mosaic_apk.py --apk "$RUNNER_TEMP/mosaic-input/signed.apk" --provenance "$RUNNER_TEMP/mosaic-input/provenance.json" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$RUNNER_TEMP/mosaic-result/verification.json"
          cp "$RUNNER_TEMP/mosaic-input/signed.apk" "$RUNNER_TEMP/mosaic-result/Mosaic-release.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: signed
        with:
          name: signed-${{ needs.build.outputs.name }}
          path: ${{ runner.temp }}/mosaic-result/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Signing exercise summary
        env:
          ARTIFACT_NAME: signed-${{ needs.build.outputs.name }}
          ARTIFACT_URL: ${{ steps.signed.outputs.artifact-url }}
        run: |
          printf 'Mosaic signing exercise verified\n\nArtifact: %s\n\nDownload: %s\n\nSource: %s\n\nRetention: 7 days. Signing only; publication is a separate job.\n' "$ARTIFACT_NAME" "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [build, sign]
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact signing-job artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-result
      - name: Validate manifest before publication credential use
        run: python -B scripts/mosaic_development_release.py manifest --directory "$RUNNER_TEMP/mosaic-result"
      - name: Publish verified development bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py publish --directory "$RUNNER_TEMP/mosaic-result"
