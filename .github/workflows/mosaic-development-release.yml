name: Mosaic development release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Explicitly authorized full protected-main SHA to build, sign and publish'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mosaic-development-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MOSAIC_EXERCISE_SHA: ${{ inputs.expected_sha }}

jobs:
  build:
    if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      name: ${{ steps.prepare.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful exact-main push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py trust
      - uses: ./.github/actions/setup
      - name: Build unsigned Release after validation
        run: |
          ./gradlew :app:assembleDefaultRelease -PmosaicPublication=true --no-daemon --no-parallel --max-workers=1
      - name: Prepare exact universal unsigned input
        id: prepare
        run: python -B scripts/mosaic_signing_exercise.py prepare --directory "$RUNNER_TEMP/mosaic-input"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: upload
        with:
          name: unsigned-${{ steps.prepare.outputs.name }}
          path: ${{ runner.temp }}/mosaic-input/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  sign:
    needs: build
    if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.expected_sha == github.sha
    uses: ./.github/workflows/mosaic-isolated-sign.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      artifact_id: ${{ needs.build.outputs.artifact_id }}
      artifact_name: ${{ needs.build.outputs.name }}

  publish:
    needs: [build, sign]
    if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && inputs.expected_sha == github.sha
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact signing-job artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-result
      - name: Validate manifest before publication credential use
        run: python -B scripts/mosaic_development_release.py manifest --directory "$RUNNER_TEMP/mosaic-result"
      - name: Publish verified development bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py publish --directory "$RUNNER_TEMP/mosaic-result"
