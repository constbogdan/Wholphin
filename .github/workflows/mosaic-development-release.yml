name: Mosaic — Development Release
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('Development · {0}',
          github.event.workflow_run.display_title
          || (github.event.workflow_run.run_number
              && format('CI run #{0}', github.event.workflow_run.run_number))
          || github.event.workflow_run.head_sha)
      || format('Development · {0}', inputs.expected_sha) }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Explicitly authorized full protected-main SHA whose CI artifact may be signed and published'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mosaic-development-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MOSAIC_EXERCISE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

jobs:
  explain_guard:
    name: Explain Development trigger
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      !((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
         github.event.workflow_run.head_sha == github.sha))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Presentation only: no checkout, API credential, output or release authority.
      - name: Explain skipped or eligible trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PY'
          import os
          e = os.environ
          reason = None
          if e['EVENT_NAME'] == 'workflow_run':
              if e['CI_EVENT'] != 'push' or e['CI_BRANCH'] != 'main' or e['CI_REPOSITORY'] != 'constbogdan/Wholphin':
                  reason = 'Trigger is not a push CI run from downstream main.'
              elif e['CI_RESULT'] != 'success':
                  reason = 'Triggering CI did not succeed; Release signing/publication is not eligible.'
              elif e['CI_SHA'] != e['GITHUB_SHA']:
                  reason = 'Superseded source: triggering CI source differs from current main at dispatch.'
          elif e['EXPECTED_SHA'] != e['GITHUB_SHA']:
              reason = 'Approved source differs from current main at dispatch.'
          if reason:
              with open(e['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('## Skipped · Development trigger\n\n' + reason + '\n\nRelease signing/publication did not start.\n')
          PY

  classify:
    name: Classify release eligibility
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_required: ${{ steps.eligibility.outputs.release_required }}
      outcome: ${{ steps.eligibility.outputs.outcome }}
      release_relevance: ${{ steps.eligibility.outputs.release_relevance }}
      validation_risk: ${{ steps.eligibility.outputs.validation_risk }}
      baseline_sha: ${{ steps.eligibility.outputs.baseline_sha }}
      artifact_id: ${{ steps.eligibility.outputs.artifact_id }}
      artifact_name: ${{ steps.eligibility.outputs.artifact_name }}
      ci_run_id: ${{ steps.eligibility.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.eligibility.outputs.ci_run_attempt }}
      version_name: ${{ steps.eligibility.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete unpublished Development range
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py eligibility
      - name: Summarize failed stage
        if: failure()
        run: |
          printf "## Failed · Development release\n\nStage: %s. Inspect the failed step before retrying; publication completion is not confirmed by this stage.\n" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: classify
    permissions:
      contents: read
      actions: read
    if: >-
      needs.classify.outputs.release_required == 'true' &&
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    environment: mosaic-release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout/SDK setup and all input checks finish before key injection.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Require exact main-CI artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.classify.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.classify.outputs.artifact_id }}
          run-id: ${{ needs.classify.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          repository: constbogdan/Wholphin
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-input
      - name: Verify trusted unsigned input
        env:
          GH_TOKEN: ${{ github.token }}
          MOSAIC_ARTIFACT_ID: ${{ needs.classify.outputs.artifact_id }}
          MOSAIC_ARTIFACT_NAME: ${{ needs.classify.outputs.artifact_name }}
          MOSAIC_BUILD_RUN_ID: ${{ needs.classify.outputs.ci_run_id }}
          MOSAIC_BUILD_RUN_ATTEMPT: ${{ needs.classify.outputs.ci_run_attempt }}
        run: |
          python3 -B scripts/mosaic_development_release.py artifact --directory "$RUNNER_TEMP/mosaic-input"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/mosaic-input/unsigned.apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/mosaic-input/unsigned.apk" >/dev/null 2>&1; then
            echo 'Refusing already signed input' >&2
            exit 1
          fi
      - name: Sign exact input without rebuilding
        env:
          MOSAIC_SIGNING_KEY: ${{ secrets.MOSAIC_SIGNING_KEY }}
          MOSAIC_KEY_ALIAS: ${{ secrets.MOSAIC_KEY_ALIAS }}
          MOSAIC_KEYSTORE_PASSWORD: ${{ secrets.MOSAIC_KEYSTORE_PASSWORD }}
          MOSAIC_KEY_PASSWORD: ${{ secrets.MOSAIC_KEY_PASSWORD }}
        uses: ./.github/actions/mosaic-sign-apk
      - name: Verify signed identity and unchanged payload
        run: |
          python3 -B scripts/mosaic_signing_exercise.py compare --directory "$RUNNER_TEMP/mosaic-input"
          mkdir "$RUNNER_TEMP/mosaic-result"
          python3 -B scripts/verify_mosaic_apk.py --apk "$RUNNER_TEMP/mosaic-input/signed.apk" --provenance "$RUNNER_TEMP/mosaic-input/provenance.json" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$RUNNER_TEMP/mosaic-result/verification.json"
          cp "$RUNNER_TEMP/mosaic-input/signed.apk" "$RUNNER_TEMP/mosaic-result/Mosaic-release.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: signed
        with:
          name: signed-mosaic-development-${{ needs.classify.outputs.version_name }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mosaic-result/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Summarize verified Mosaic signing
        env:
          ARTIFACT_NAME: signed-mosaic-development-${{ needs.classify.outputs.version_name }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.signed.outputs.artifact-url }}
        run: |
          printf '## Mosaic signing verified\n\nArtifact: %s\n\nDownload: %s\n\nSource: %s\n\nRetention: 7 days. Exact input signed and verified; publication follows separately.\n' "$ARTIFACT_NAME" "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize failed stage
        if: failure()
        run: |
          printf "## Failed · Development release\n\nStage: %s. Inspect the failed step before retrying; publication completion is not confirmed by this stage.\n" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish Development
    needs: [classify, sign]
    if: >-
      needs.classify.outputs.release_required == 'true' &&
      github.repository == 'constbogdan/Wholphin' && github.ref == 'refs/heads/main' && github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'constbogdan/Wholphin' &&
        github.event.workflow_run.head_sha == github.sha))
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact signing-job artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-result
      - name: Validate manifest before publication credential use
        env:
          MOSAIC_BUILD_RUN_ID: ${{ needs.classify.outputs.ci_run_id }}
          MOSAIC_BUILD_RUN_ATTEMPT: ${{ needs.classify.outputs.ci_run_attempt }}
        run: python -B scripts/mosaic_development_release.py manifest --directory "$RUNNER_TEMP/mosaic-result"
      - name: Publish verified development bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py publish --directory "$RUNNER_TEMP/mosaic-result"
      - name: Summarize failed stage
        if: failure()
        run: |
          printf "## Failed · Development release\n\nStage: %s. Inspect the failed step before retrying; publication completion is not confirmed by this stage.\n" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
